name = "screenshots-via-email"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[vars]
# ⚠️ It is safer to set sensitive values like API keys
# via the Cloudflare dashboard
BREVO_API_KEY = "your-brevo-api-key"
BREVO_FROM_EMAIL = "example@example.com"
SCREENSHOT_API_BASE = "https://api.screen-shot.xyz"
